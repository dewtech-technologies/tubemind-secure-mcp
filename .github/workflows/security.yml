name: Security

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v3
        with:
          version: '9.15.4'
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies (CVE HIGH/CRITICAL bloqueia)
        run: pnpm audit --audit-level=high
      - name: Build TypeScript
        run: pnpm build
      - name: Tests (incluindo red team prompt injection)
        run: pnpm test
      - name: Lint
        run: pnpm lint

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
