name: Security

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v3
        with:
          version: '9.15.4'
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies (CVE HIGH/CRITICAL bloqueia)
        run: pnpm audit --audit-level=high
      - name: Build TypeScript
        run: pnpm build
      - name: Tests (incluindo red team prompt injection)
        run: pnpm test
      - name: Lint
        run: pnpm lint

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action@v2 exige licença paga em repositórios de organização;
      # o CLI (MIT) faz a mesma varredura sem licença. Versão e hash fixados.
      - name: Install gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$archive" gitleaks
      - name: Scan git history for secrets
        run: gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1
